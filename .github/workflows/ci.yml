name: CI Verification

on:
  pull_request:
    branches: [main, master, 'feature/**', 'release/**', '[0-9]*.[0-9]*.[0-9]*']
  push:
    branches: [main, master, 'feature/**', 'release/**', '[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC

permissions:
  contents: read

jobs:
  docs-and-privacy:
    name: Docs & Privacy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Privacy Gate
        run: node tools/check-privacy.mjs

      - name: Source Docs Consistency Check
        run: node tools/check-docs.mjs --source-only

  windows-build:
    name: Windows Rust + WebView2 Build & Core Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Rust Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native-win/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native-win/Cargo.toml', 'native-win/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dependencies
        run: npm ci

      - name: Native UI Harness Typecheck
        run: node tools/native-build.mjs --typecheck --ui-test

      - name: Run Windows Core Tests
        shell: pwsh
        run: |
          node --test --test-timeout=30000 `
            test/core.test.mjs `
            test/i18n-foundation.test.mjs `
            test/ipc.test.mjs `
            test/ipc-hardening.test.mjs `
            test/controller-contracts.test.mjs `
            test/tasks-contracts.test.mjs `
            test/pricing-catalog-sync.test.mjs `
            test/privacy-gate.test.mjs

      - name: Ensure NSIS (makensis)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Package Windows Installer & Portable ZIP
        run: node tools/package-win.mjs --skip-build

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravitybox-windows-build
          path: |
            成品/*.exe
            成品/*.zip
            成品/*.sha256
            成品/release-manifest.json
          retention-days: 7
